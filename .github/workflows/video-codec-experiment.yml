name: Modern video codec comparison (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: video-codec-experiment
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11324160558
          run-id: 37258408345
          github-token: ${{ github.token }}
          path: prior
          merge-multiple: true
      - run: node --test experiments/video-codec/policy.test.mjs
      - run: docker build -t fia-codec-experiment container
      - name: One sequential retained-source strategy pair
        run: |
          mkdir evidence
          docker run --name fia-codec-experiment --network none --memory 2g --cpus 2 --ulimit fsize=62914560:62914560 -v "$PWD:/proof:ro" -v "$PWD/prior:/prior:ro" -v "$PWD/evidence:/evidence" fia-codec-experiment node /proof/experiments/video-codec/run.mjs /prior /evidence
      - name: Stop remaining experiment process
        if: always()
        run: docker rm -f fia-codec-experiment || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-codec-strategy-comparison
          path: evidence
          retention-days: 7
