name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run tsc --noEmit

      - name: Run unit tests
        run: bun test

  # This Worker implements Durable Objects/Containers. Cloudflare does not
  # generate version URLs for it, so a PR version cannot be a live smoke target.
  # PRs retain unit/type checks (and the video container job when introduced).
  # After Workers Builds deploys main, root verifies the exact successful build
  # and runs smoke-test.ts plus smoke-mcp.ts on development before staging.
