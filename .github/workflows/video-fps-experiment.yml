name: Video FPS experiment (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: video-fps-experiment
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11324160558
          run-id: 37258408345
          github-token: ${{ github.token }}
          path: prior
          merge-multiple: true
      - name: Build unchanged encoder runtime
        run: docker build -t fia-fps-experiment container
      - name: Measure explicit reviewed 720p cadence pair
        run: |
          mkdir evidence
          docker run --name fia-fps-experiment --network none --memory 2g --cpus 2 --ulimit fsize=62914560:62914560 -v "$PWD:/proof:ro" -v "$PWD/prior:/prior:ro" -v "$PWD/evidence:/evidence" fia-fps-experiment node /proof/experiments/video-fps/run.mjs /prior /evidence
      - name: Stop any remaining experiment process
        if: always()
        run: docker rm -f fia-fps-experiment || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-fps-720-measurement
          path: evidence
          retention-days: 7
