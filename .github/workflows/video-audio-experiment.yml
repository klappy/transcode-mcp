name: Video audio experiment (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: video-audio-experiment
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11324160558
          run-id: 37258408345
          github-token: ${{ github.token }}
          path: prior
          merge-multiple: true
      - run: node --test experiments/video-audio/policy.test.mjs
      - run: docker build -t fia-audio-experiment container
      - name: One retained-source audio encode, no network
        run: |
          mkdir evidence
          docker run --name fia-audio-experiment --network none --memory 2g --cpus 2 --ulimit fsize=62914560:62914560 -v "$PWD:/proof:ro" -v "$PWD/prior:/prior:ro" -v "$PWD/evidence:/evidence" fia-audio-experiment node /proof/experiments/video-audio/run.mjs /prior /evidence
      - name: Stop remaining experiment process
        if: always()
        run: docker rm -f fia-audio-experiment || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-audio-medium-measurement
          path: evidence
          retention-days: 7
